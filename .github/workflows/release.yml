name: Release
# Auto-Release: Bei jedem Push auf main wird die Version aus manifest.json gelesen.
# Gibt es dafür noch keinen Release, werden Tests ausgeführt und danach Tag + Release + thermocore.zip erzeugt.
# Neue Version veröffentlichen = "version" in custom_components/thermocore/manifest.json erhöhen und pushen.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      exists: ${{ steps.v.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(jq -r .version custom_components/thermocore/manifest.json)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"; echo "Release v$V existiert bereits – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"; echo "Neuer Release v$V wird erstellt."
          fi
  release:
    needs: check
    if: needs.check.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Tests
        run: pip install -q pytest-homeassistant-custom-component && python -m pytest -q tests
      - name: ZIP bauen
        run: cd custom_components/thermocore && zip -r ../../thermocore.zip . -x '__pycache__/*' -x 'frontend/*.src.js'
      - name: Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ThermoCore ${{ needs.check.outputs.version }}
          generate_release_notes: true
          files: thermocore.zip
